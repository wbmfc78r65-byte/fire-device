<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>消防设备巡检</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: #f5f5f5;
  min-height: 100vh;
  padding-bottom: 30px;
}
.header {
  background: linear-gradient(135deg, #c0392b, #e74c3c);
  color: #fff;
  padding: 24px 20px;
  text-align: center;
}
.header .icon { font-size: 40px; margin-bottom: 8px; }
.header h1 { font-size: 22px; font-weight: 600; }
.header .code { font-size: 13px; opacity: 0.9; margin-top: 6px; }
.status-tag {
  display: inline-block;
  padding: 3px 14px;
  border-radius: 12px;
  font-size: 13px;
  font-weight: 600;
  margin-top: 10px;
}
.status-normal { background: rgba(255,255,255,0.25); }
.status-fault { background: #721c24; }
.status-wait { background: #856404; }
.container { max-width: 480px; margin: 0 auto; padding: 16px; }
.section {
  background: #fff;
  border-radius: 10px;
  margin-bottom: 16px;
  overflow: hidden;
  box-shadow: 0 2px 8px rgba(0,0,0,0.06);
}
.section-title {
  font-size: 16px;
  font-weight: 600;
  color: #c0392b;
  padding: 14px 16px;
  border-bottom: 2px solid #c0392b;
  display: flex;
  align-items: center;
  gap: 8px;
}
.info-table { width: 100%; border-collapse: collapse; }
.info-table td {
  padding: 12px 16px;
  border-bottom: 1px solid #f0f0f0;
  font-size: 14px;
}
.info-table td:first-child {
  width: 90px;
  color: #888;
  background: #fafafa;
}
.info-table td:last-child {
  color: #333;
  font-weight: 500;
  word-break: break-all;
}
.info-table tr:last-child td { border-bottom: none; }
.form-area { padding: 16px; }
.form-group { margin-bottom: 14px; }
.form-group label {
  display: block;
  font-size: 13px;
  color: #666;
  margin-bottom: 6px;
}
.form-group input, .form-group select, .form-group textarea {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid #ddd;
  border-radius: 6px;
  font-size: 14px;
  font-family: inherit;
}
.form-group textarea { resize: vertical; min-height: 60px; }
.result-options {
  display: flex;
  gap: 8px;
  margin-bottom: 14px;
}
.result-option {
  flex: 1;
  padding: 12px 8px;
  border: 2px solid #ddd;
  border-radius: 8px;
  text-align: center;
  cursor: pointer;
  font-size: 14px;
  font-weight: 500;
  transition: all 0.2s;
}
.result-option.active {
  border-color: #c0392b;
  background: #fef5f5;
  color: #c0392b;
}
.result-option .emoji { font-size: 20px; display: block; margin-bottom: 4px; }
.btn-submit {
  width: 100%;
  padding: 14px;
  background: linear-gradient(135deg, #c0392b, #e74c3c);
  color: #fff;
  border: none;
  border-radius: 8px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
}
.btn-submit:active { opacity: 0.8; }
.records { padding: 0 16px 16px; }
.record-item {
  padding: 12px 0;
  border-bottom: 1px solid #f0f0f0;
  font-size: 13px;
}
.record-item:last-child { border-bottom: none; }
.record-header {
  display: flex;
  justify-content: space-between;
  margin-bottom: 4px;
}
.record-person { font-weight: 600; color: #333; }
.record-date { color: #999; }
.record-result { color: #c0392b; font-weight: 500; }
.record-remark { color: #666; margin-top: 4px; }
.empty { text-align: center; padding: 30px; color: #999; font-size: 14px; }
.tips {
  background: #fff8e1;
  border-left: 3px solid #ffc107;
  padding: 12px 16px;
  font-size: 12px;
  color: #856404;
  margin: 0 16px 16px;
  border-radius: 0 6px 6px 0;
}
.success-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.5);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 999;
}
.success-box {
  background: #fff;
  border-radius: 16px;
  padding: 40px 30px;
  text-align: center;
  max-width: 300px;
}
.success-icon {
  width: 60px;
  height: 60px;
  background: #10b981;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 16px;
  font-size: 30px;
  color: #fff;
}
.success-box h3 { color: #333; margin-bottom: 8px; }
.success-box p { color: #666; font-size: 14px; margin-bottom: 20px; }
.success-box button {
  padding: 10px 30px;
  background: #c0392b;
  color: #fff;
  border: none;
  border-radius: 6px;
  font-size: 14px;
  cursor: pointer;
}
.photo-upload {
  border: 2px dashed #ddd;
  border-radius: 8px;
  padding: 20px;
  text-align: center;
  cursor: pointer;
  color: #999;
  font-size: 13px;
}
.photo-upload:hover { border-color: #c0392b; color: #c0392b; }
.photo-preview { max-width: 100%; border-radius: 8px; margin-top: 8px; }
/* 登录界面 */
.login-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: linear-gradient(135deg, #c0392b, #e74c3c);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
}
.login-box {
  background: #fff;
  border-radius: 16px;
  padding: 30px 24px;
  width: 90%;
  max-width: 320px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.2);
}
.login-box h2 {
  text-align: center;
  color: #c0392b;
  margin-bottom: 6px;
  font-size: 20px;
}
.login-box .subtitle {
  text-align: center;
  color: #999;
  font-size: 13px;
  margin-bottom: 20px;
}
.login-box .form-group { margin-bottom: 14px; }
.login-box label {
  display: block;
  font-size: 13px;
  color: #666;
  margin-bottom: 6px;
}
.login-box input {
  width: 100%;
  padding: 12px;
  border: 1px solid #ddd;
  border-radius: 8px;
  font-size: 15px;
  box-sizing: border-box;
}
.login-box input:focus {
  outline: none;
  border-color: #c0392b;
}
.login-box .btn-login {
  width: 100%;
  padding: 13px;
  background: linear-gradient(135deg, #c0392b, #e74c3c);
  color: #fff;
  border: none;
  border-radius: 8px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  margin-top: 6px;
}
.login-box .btn-login:active { opacity: 0.8; }
.login-error {
  color: #e74c3c;
  font-size: 13px;
  text-align: center;
  margin-top: 10px;
  min-height: 18px;
}
.user-info-bar {
  background: #f0fdf4;
  border-left: 3px solid #10b981;
  padding: 10px 16px;
  font-size: 13px;
  color: #065f46;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.user-info-bar .logout {
  color: #10b981;
  cursor: pointer;
  font-size: 12px;
  text-decoration: underline;
}
</style>
</head>
<body>
<!-- 登录界面 -->
<div class="login-overlay" id="login-overlay">
  <div class="login-box">
    <h2>🔥 消防巡检系统</h2>
    <div class="subtitle">请登录后进行巡检</div>
    <div class="form-group">
      <label>工号</label>
      <input type="text" id="login-id" placeholder="请输入工号" maxlength="20">
    </div>
    <div class="form-group">
      <label>密码</label>
      <input type="password" id="login-password" placeholder="请输入密码" maxlength="20">
    </div>
    <button class="btn-login" onclick="doLogin()">登 录</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<!-- 主内容（登录后显示） -->
<div id="main-content" style="display:none">
<div class="header" id="header">
  <div class="icon">🔥</div>
  <h1 id="dev-title">消防设备</h1>
  <div class="code" id="dev-code"></div>
  <span class="status-tag" id="dev-status-tag" style="background:rgba(255,255,255,0.2)">加载中...</span>
</div>
<!-- 登录身份栏 -->
<div class="user-info-bar" id="user-info-bar" style="display:none"></div>

<div class="container">
  <!-- 设备信息 -->
  <div class="section">
    <div class="section-title">📋 设备信息</div>
    <table class="info-table" id="info-table">
      <tr><td colspan="2" style="text-align:center;color:#999;padding:30px">正在加载设备信息...</td></tr>
    </table>
  </div>

  <!-- 巡检打卡（巡检员/验收员可见） -->
  <div class="section" id="inspect-section">
    <div class="section-title">✅ 巡检打卡</div>
    <div class="form-area">
      <div class="form-group">
        <label>巡检人 *</label>
        <input type="text" id="check-person" placeholder="请输入巡检人姓名">
      </div>
      <div class="form-group">
        <label>巡检结果 *</label>
        <div class="result-options">
          <div class="result-option active" data-result="正常" onclick="selectResult(this)">
            <span class="emoji">✅</span>正常
          </div>
          <div class="result-option" data-result="故障" onclick="selectResult(this)">
            <span class="emoji">⚠️</span>故障
          </div>
          <div class="result-option" data-result="需维保" onclick="selectResult(this)">
            <span class="emoji">🔧</span>需维保
          </div>
        </div>
      </div>
      <div class="form-group">
        <label>备注</label>
        <textarea id="check-remark" placeholder="检查情况描述（选填）"></textarea>
      </div>
      <div class="form-group">
        <label>现场照片（选填）</label>
        <div class="photo-upload" onclick="document.getElementById('check-photo').click()">
          📷 点击上传现场照片
        </div>
        <input type="file" id="check-photo" accept="image/*" capture="environment" style="display:none" onchange="previewPhoto(this)">
        <img id="photo-preview" class="photo-preview" style="display:none">
      </div>
      <!-- 自定义表单 -->
      <div class="form-group" id="custom-form-group" style="display:none">
        <label>关联表单</label>
        <select id="check-form-select" onchange="onDeviceFormChange(this.value)" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;font-size:14px;box-sizing:border-box">
          <option value="">-- 不使用表单 --</option>
        </select>
        <div id="check-form-area" style="margin-top:10px;padding:12px;background:#f8f9fa;border-radius:8px;display:none;overflow-x:hidden;max-width:100%;box-sizing:border-box"></div>
      </div>
      <div id="form-debug" style="font-size:12px;color:#6b7280;margin-top:8px;display:none"></div>
      <button class="btn-submit" onclick="submitCheck()">提交巡检记录</button>
    </div>
  </div>

  <!-- 维修打卡（维修员/验收员可见） -->
  <div class="section" id="maintain-section" style="display:none">
    <div class="section-title">🔧 维修打卡</div>
    <div class="form-area">
      <div class="form-group">
        <label>维修人 *</label>
        <input type="text" id="maintain-person" placeholder="请输入维修人姓名">
      </div>
      <div class="form-group">
        <label>维修结果 *</label>
        <select id="maintain-result" style="width:100%;padding:10px 12px;border:1px solid #ddd;border-radius:6px;font-size:14px;box-sizing:border-box">
          <option value="维修完成">✅ 维修完成</option>
          <option value="部分修复">⚠️ 部分修复</option>
          <option value="无法修复">❌ 无法修复</option>
          <option value="待配件">🔧 待配件</option>
        </select>
      </div>
      <div class="form-group">
        <label>维修描述</label>
        <textarea id="maintain-remark" placeholder="维修情况描述（选填）"></textarea>
      </div>
      <div class="form-group">
        <label>现场照片（选填）</label>
        <div class="photo-upload" onclick="document.getElementById('maintain-photo').click()">
          📷 点击上传现场照片
        </div>
        <input type="file" id="maintain-photo" accept="image/*" capture="environment" style="display:none" onchange="previewMaintainPhoto(this)">
        <img id="maintain-photo-preview" class="photo-preview" style="display:none">
      </div>
      <!-- 维修自定义表单 -->
      <div class="form-group" id="maintain-form-group" style="display:none">
        <label>关联表单</label>
        <select id="maintain-form-select" onchange="onMaintainFormChange(this.value)" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;font-size:14px;box-sizing:border-box">
          <option value="">-- 不使用表单 --</option>
        </select>
        <div id="maintain-form-area" style="margin-top:10px;padding:12px;background:#f8f9fa;border-radius:8px;display:none;overflow-x:hidden;max-width:100%;box-sizing:border-box"></div>
      </div>
      <button class="btn-submit" style="background:linear-gradient(135deg,#d97706,#f59e0b)" onclick="submitMaintain()">提交维修记录</button>
    </div>
  </div>

  <!-- 无岗位权限提示 -->
  <div id="no-permission" class="section" style="display:none">
    <div class="section-title" style="color:#d97706">⚠️ 无岗位权限</div>
    <div class="form-area">
      <div style="font-size:14px;color:#666;line-height:1.8;text-align:center;padding:20px 10px">
        该工号未分配巡检/维修/验收岗位，无法操作。<br>
        请联系管理员在「人员管理」中为该人员分配岗位。
      </div>
    </div>
  </div>

  <!-- 历史记录（巡检员/验收员可见） -->
  <div class="section" id="inspect-history-section">
    <div class="section-title">📝 巡检历史</div>
    <div class="records" id="records-list">
      <div class="empty">暂无巡检记录</div>
    </div>
  </div>

  <div class="tips" id="inspect-tips">💡 巡检记录自动同步到主系统。在主系统「维保巡检」中可查看所有巡检记录。</div>
</div>
</div><!-- /main-content -->

<!-- 提交成功弹窗 -->
<div class="success-overlay" id="success-overlay">
  <div class="success-box">
    <div class="success-icon">✓</div>
    <h3 id="success-title">提交成功</h3>
    <p id="success-msg">记录已提交</p>
    <button onclick="closeSuccess()">确定</button>
  </div>
</div>

<script src="js/tcb.js"></script>

<script>
// ===== 测试环境判断（GitHub Pages / Vercel / 本地 / file:// 直接打开 自动启用本地模式，不请求云端）=====
const IS_TEST_ENV = (!location.hostname || location.hostname.indexOf('github.io') !== -1 || location.hostname.indexOf('vercel.app') !== -1 || location.hostname === 'localhost' || location.hostname === '127.0.0.1');
// 本地人员列表（主系统人员管理写入的 localStorage firemap_staff）
function getLocalStaff() {
  try { return JSON.parse(localStorage.getItem("firemap_staff") || "[]"); } catch(e) { return []; }
}
// 从本地 IndexedDB 查设备
let _dbReady = null;
// 本地模式初始化 IndexedDB（与主系统同库：默认项目 FireMapDB）
function ensureDBReady() {
  if (_dbReady) return _dbReady;
  _dbReady = (async function() {
    if (typeof openMetaDB === 'function') await openMetaDB();
    if (typeof ensureDefaultProject === 'function') await ensureDefaultProject();
    if (typeof openDB === 'function') await openDB();
  })().catch(e => { _dbReady = null; throw e; });
  return _dbReady;
}
async function getLocalDevice(deviceId) {
  try {
    await ensureDBReady();
    const all = await dbGetAll(SD);
    return all.find(x => x.id === deviceId) || null;
  } catch(e) { return null; }
}
// 从本地 IndexedDB 查单个表单
async function getLocalForm(formId) {
  try {
    await ensureDBReady();
    const all = await dbGetAll(S_FORM);
    return all.find(f => f.id === formId) || null;
  } catch(e) { return null; }
}
// 从本地 IndexedDB 查所有未删除表单
async function getLocalForms() {
  try {
    await ensureDBReady();
    const all = await dbGetAll(S_FORM);
    return (all || []).filter(f => !f.deleted);
  } catch(e) { return []; }
}
// 解析角色（兼容本地JS数组和云端PostgreSQL数组字符串 {inspector,repairer}）
function getRoleArray(roles) {
  if (Array.isArray(roles)) return roles;
  if (typeof roles === 'string') return roles.replace(/[{}]/g, '').split(',').filter(Boolean);
  return [];
}
// 腾讯云配置

const SUPABASE_KEY = 'eyJhbGciOiJSUzI1NiIsImtpZCI6IjU3OWQxZGJkLWE1NGYtNDE4MS1iOTMzLWY1NGRhNWIwZTc3OSJ9.eyJpc3MiOiJodHRwczovL2ZpcmUtbWFwLXN5c3RlbS1kNGY3cnc4d2JkMDBlNWY1LmFwLXNoYW5naGFpLnRjYi1hcGkudGVuY2VudGNsb3VkYXBpLmNvbSIsInN1YiI6ImFub24iLCJhdWQiOiJmaXJlLW1hcC1zeXN0ZW0tZDRmN3J3OHdiZDAwZTVmNSIsImV4cCI6NDA5MjM4NjU4NSwiaWF0IjoxNzg4NzAzMzg1LCJub25jZSI6Ik1CQTVQbEFpVEplbEEweWV4RFJRZ2ciLCJhdF9oYXNoIjoiTUJBNVBsQWlUSmVsQTB5ZXhEUlFnZyIsIm5hbWUiOiJBbm9ueW1vdXMiLCJzY29wZSI6ImFub255bW91cyIsInByb2plY3RfaWQiOiJmaXJlLW1hcC1zeXN0ZW0tZDRmN3J3OHdiZDAwZTVmNSIsIm1ldGEiOnsicGxhdGZvcm0iOiJQdWJsaXNoYWJsZUtleSJ9LCJyb2xlIjoiYW5vbiIsImlzX2Fub255bW91cyI6dHJ1ZSwiYXBwX21ldGFkYXRhIjp7InByb3ZpZGVyIjoiYW5vbnltb3VzIiwicHJvdmlkZXJzIjpbImFub255bW91cyJdfSwidXNlcl9tZXRhZGF0YSI6eyJuYW1lIjoiQW5vbnltb3VzIn0sInVzZXJfdHlwZSI6IiIsImNsaWVudF90eXBlIjoiY2xpZW50X3VzZXIiLCJpc19zeXN0ZW1fYWRtaW4iOmZhbHNlfQ.OtHsyA9lLX_iKfgouUrY6NXB3bjRq2UBgd-DRNnBDgs1GgxnfO0QSc42zIaTVfGSK6738k_EUd27WLNiw4AXCRSBTLFJmyG3EP8Pt7Be4xzrRJefSBHBqCqceOCOGS3whtHgEBB_Pk9ckKse35aFTn3GpIFi9DZTmJfuv3MixGyqbS4snhQVeb7du1U6rDP9coh6KHIQ1u2cmG4oHJNGReAMoncaZgnQMD_ptB8l3SbIlh2yrxav4tg7jh1QTF-SqXfZjXBpgLJ7okPMX99b9lbpYsqnoulxsibSps1qVsJVAxGYk_eljqZjZM4SBH0WvY8DY4Xvz6nUKkuFPBZ8QA';
const supabaseClient = createTCBClient(SUPABASE_URL, SUPABASE_KEY);

// 当前登录的巡检员
let currentInspector = null;

// 从云端获取巡检员列表
async function getInspectors() {
  try {
    if (!supabaseClient) {
      return { error: '客户端未初始化' };
    }
    
    console.log('开始查询inspectors表...');
    const result = await supabaseClient.from('inspectors').select('*');
    console.log('查询结果:', JSON.stringify(result));
    
    if (result.error) {
      console.error('API错误:', result.error);
      return { error: 'API错误: ' + result.error.message + ' (' + result.error.code + ')' };
    }
    
    console.log('获取到巡检员数量:', (result.data || []).length);
    return { data: result.data || [] };
  } catch (e) {
    console.error('异常:', e);
    return { error: '异常: ' + e.message };
  }
}

// 简单的密码编码（base64）
function encodePassword(pwd) {
  return btoa(unescape(encodeURIComponent(pwd)));
}

// 登录
async function doLogin() {
  const id = document.getElementById('login-id').value.trim();
  const password = document.getElementById('login-password').value;
  const errorEl = document.getElementById('login-error');
  
  if (!id || !password) {
    errorEl.innerText = '请输入工号和密码';
    return;
  }
  
  errorEl.innerText = '登录中...';
  
  const encodedPwd = encodePassword(password);
  
  // ===== 本地模式（测试环境）：从主系统人员管理数据校验 =====
  if (IS_TEST_ENV) {
    const staff = getLocalStaff();
    const person = staff.find(s => s.workId === id && s.password === encodedPwd);
    if (person) {
      const roles = getRoleArray(person.roles);
      currentInspector = { id: person.workId, name: person.name, roles: roles };
      localStorage.setItem('firemap_inspector', JSON.stringify({
        id: currentInspector.id,
        name: currentInspector.name,
        roles: roles,
        loginTime: Date.now()
      }));
      showMainContent();
      errorEl.innerText = '';
      return;
    }
    const found = staff.find(s => s.workId === id);
    if (found) {
      errorEl.innerText = '密码错误';
    } else {
      errorEl.innerText = '工号不存在（请先在主系统「人员管理」添加并设置岗位）';
    }
    return;
  }
  
  const result = await getInspectors();
  
  if (result.error) {
    errorEl.innerText = result.error;
    return;
  }
  
  const inspectors = result.data;
  
  console.log('输入工号:', id, '编码密码:', encodedPwd);
  console.log('巡检员列表:', inspectors);
  
  const inspector = inspectors.find(i => i.id === id && i.password === encodedPwd);
  
  if (inspector) {
    const roles = getRoleArray(inspector.roles);
    currentInspector = { id: inspector.id, name: inspector.name, roles: roles };
    localStorage.setItem('firemap_inspector', JSON.stringify({
      id: currentInspector.id,
      name: currentInspector.name,
      roles: roles,
      loginTime: Date.now()
    }));
    showMainContent();
    errorEl.innerText = '';
  } else {
    const found = inspectors.find(i => i.id === id);
    if (found) {
      errorEl.innerText = '密码错误（库:' + found.password + ' 输:' + encodedPwd + '）';
    } else {
      errorEl.innerText = '工号不存在（共' + inspectors.length + '个）';
    }
  }
}

// 检查登录状态（7天内有效）
function checkLogin() {
  try {
    const saved = localStorage.getItem('firemap_inspector');
    if (saved) {
      const data = JSON.parse(saved);
      if (Date.now() - data.loginTime < 7 * 24 * 60 * 60 * 1000) {
        currentInspector = data;
        return true;
      }
    }
  } catch (e) {}
  return false;
}

  if (!currentInspector) return;
  
  // 根据角色控制界面显示：巡检员→巡检界面、维修员→维修界面、验收员→两者都显示
  const roles = getRoleArray(currentInspector.roles);

  const canMaintain = roles.indexOf('repairer') >= 0 || roles.indexOf('acceptor') >= 0;
  const inspectSec = document.getElementById('inspect-section');
  const maintainSec = document.getElementById('maintain-section');
  if (inspectSec) inspectSec.style.display = canInspect ? '' : 'none';
  if (maintainSec) maintainSec.style.display = canMaintain ? '' : 'none';

  if (historySec) historySec.style.display = canInspect ? '' : 'none';
  if (tipsEl) tipsEl.style.display = canInspect ? '' : 'none';

      '<span class="logout" onclick="logoutScan()">退出</span>';

  if (personInput) {

  loadDeviceForms();
  loadMaintainForms();
}

// 从云端获取设备信息（带自动重试）
async function getDeviceFromCloud(deviceId, retries) {
  const maxRetries = retries || 3;
  for (let attempt = 1; attempt <= maxRetries; attempt++) {
    try {
      console.log('[扫码] 开始查询设备(第' + attempt + '次), deviceId=', deviceId);
      const { data, error } = await supabaseClient
        .from('devices')
        .select('*')
        .eq('id', deviceId)
        .single();
      if (error) {
        console.error('[扫码] 从云端获取设备失败(第' + attempt + '次):', error);
        // 网络错误/超时等可重试错误，尝试下一次
        if (attempt < maxRetries) {
          await new Promise(r => setTimeout(r, 800));
          continue;
        }
        return { _error: error.message || JSON.stringify(error), _code: error.code };
      }
      console.log('[扫码] 查询成功, data=', data);
      if (!data) {
        return { _error: '云端未找到该设备记录（ID: ' + deviceId + '），请先在主系统点击「同步到云端」', _code: 'NOT_FOUND' };
      }
      if (!data.device_data) {
        return { _error: '设备记录存在但 device_data 字段为空，请检查云端表结构', _code: 'EMPTY_DATA' };
      }
      return data.device_data;
    } catch (e) {
      console.error('[扫码] 从云端获取设备异常(第' + attempt + '次):', e);
      if (attempt < maxRetries) {
        await new Promise(r => setTimeout(r, 800));
        continue;
      }
      return { _error: e.message || '查询异常', _code: 'EXCEPTION' };
    }
  }
}

      device_id: record.deviceId || '',
      floor_id: record.floorId || '',

      inspect_time: record.inspectTime || new Date().toTimeString().split(' ')[0],
      source: 'qrcode'
    };
    const { error } = await supabaseClient.from('inspect_logs').insert(logData);
    if (error) {

      return false;
    }

  }

// 从云端加载可用表单
async function loadDeviceForms() {
  try {
    // ===== 本地模式（测试环境）：从主系统本地表单读取 =====
    if (IS_TEST_ENV) {
      const forms = await getLocalForms();
      if (!forms.length) {
        _showFormDebug('⚠️ 本地暂无表单（请先在主系统创建表单）');
        return;
      }
      if (!_devicePresetFormId) {
        document.getElementById('custom-form-group').style.display = 'block';
      }
      const select = document.getElementById('check-form-select');
      forms.sort((a, b) => new Date(b.updatedAt || b.createdAt) - new Date(a.updatedAt || a.createdAt));
      forms.forEach(f => {
        const option = document.createElement('option');
        option.value = f.id;
        option.textContent = f.name || '未命名表单';
        select.appendChild(option);
      });
      _showFormDebug('✅ 已加载 ' + forms.length + ' 个本地表单');
      return;
    }
    // 注意：腾讯云TCB客户端不支持.order()链式调用，改用JS排序
    let { data, error } = await supabaseClient
      .from('custom_forms')
      .select('*')
      .eq('deleted', false);
    // 如果 deleted 列不存在（旧表结构），回退为不带条件查询
    // 注意：错误码可能是 PGRST204 或 DATABASE_PGRST204，用包含匹配
    if (error && String(error.code || '').indexOf('PGRST204') >= 0) {
      console.log('deleted列不存在，回退全量查询');
      const r2 = await supabaseClient.from('custom_forms').select('*');
      data = r2.data; error = r2.error;
    }
    if (error) {
      console.log('表单表不存在，隐藏表单选择:', error.message);
      _showFormDebug('⚠️ 表单查询失败：' + (error.message || '未知错误'));
      return;
    }
    if (!data || data.length === 0) {
      console.log('云端没有表单数据');
      _showFormDebug('⚠️ 云端暂无表单（请在主系统点「同步到云端」）');
      return;
    }
    data.sort((a, b) => new Date(b.updated_at || b.created_at) - new Date(a.updated_at || a.created_at));
    
    // 显示表单选择区域（仅当设备没有预设表单时）
    if (!_devicePresetFormId) {
      document.getElementById('custom-form-group').style.display = 'block';
    }
    const select = document.getElementById('check-form-select');
    data.forEach(f => {
      const option = document.createElement('option');
      option.value = f.id;
      option.textContent = f.name || '未命名表单';
      select.appendChild(option);
    });
    _showFormDebug('✅ 已加载 ' + data.length + ' 个表单');
  } catch (e) {
    console.log('加载表单失败:', e);
    _showFormDebug('❌ 加载表单异常：' + e.message);
  }
}

// 渲染表单字段（简化版，支持常用类型；prefix: df_=巡检表单 / mf_=维修表单）
function renderDeviceForm(form, areaEl, idPrefix) {
  const area = areaEl || document.getElementById('check-form-area');
  const prefix = idPrefix || 'df_';
  area.style.display = 'block';
  
  let html = '<div style="font-size:13px;font-weight:600;color:#333;margin-bottom:10px">' + (form.name || '表单') + '</div>';
  
  const groups = form.groups || [];
  groups.forEach(g => {
    if (g.name) {
      html += '<div style="font-size:12px;font-weight:600;color:#666;margin:10px 0 6px;padding-bottom:4px;border-bottom:1px solid #e5e7eb">' + g.name + '</div>';
    }
    (g.fields || []).forEach(f => {
      const fieldId = prefix + f.id;
      const required = f.required ? '<span style="color:#ef4444">*</span>' : '';
      html += '<div style="margin-bottom:10px;max-width:100%">';
      html += '<label style="display:block;font-size:12px;color:#555;margin-bottom:4px">' + (f.label || '字段') + ' ' + required + '</label>';
      
      switch (f.type) {
        case 'text':
        case 'name':
        case 'phone':
        case 'idcard':
        case 'email':
        case 'number':
          html += '<input type="text" id="' + fieldId + '" placeholder="' + (f.placeholder || '') + '" style="width:100%;padding:8px 10px;border:1px solid #ddd;border-radius:6px;font-size:13px;box-sizing:border-box" onchange="onFormFieldChange(\'' + prefix + '\',\'' + f.id + '\',this.value)">';
          break;
        case 'textarea':
          html += '<textarea id="' + fieldId + '" rows="2" placeholder="' + (f.placeholder || '') + '" style="width:100%;padding:8px 10px;border:1px solid #ddd;border-radius:6px;font-size:13px;box-sizing:border-box;resize:vertical" onchange="onFormFieldChange(\'' + prefix + '\',\'' + f.id + '\',this.value)"></textarea>';
          break;
        case 'select':
        case 'radio':
        case 'hazard':
        case 'department':
        case 'weather':
        case 'wind':
        case 'gender':
          const opts = f.options || [];
          html += '<select id="' + fieldId + '" style="width:100%;padding:8px 10px;border:1px solid #ddd;border-radius:6px;font-size:13px;box-sizing:border-box" onchange="onFormFieldChange(\'' + prefix + '\',\'' + f.id + '\',this.value)">';
          html += '<option value="">请选择</option>';
          opts.forEach(o => { html += '<option value="' + o + '">' + o + '</option>'; });
          html += '</select>';
          break;
        case 'checkbox':
          const cOpts = f.options || [];
          cOpts.forEach(o => {
            html += '<label style="display:flex;align-items:center;gap:6px;font-size:13px;margin-bottom:4px;cursor:pointer"><input type="checkbox" value="' + o + '" onchange="onFormCheckChange(\'' + prefix + '\',\'' + f.id + '\',this)"> ' + o + '</label>';
          });
          break;
        case 'date':
        case 'datetime':
          html += '<input type="' + (f.type === 'datetime' ? 'datetime-local' : 'date') + '" id="' + fieldId + '" style="width:100%;max-width:100%;min-width:0;padding:8px 10px;border:1px solid #ddd;border-radius:6px;font-size:13px;box-sizing:border-box;-webkit-appearance:none;appearance:none" onchange="onFormFieldChange(\'' + prefix + '\',\'' + f.id + '\',this.value)">';
          break;
        case 'time':
          html += '<input type="time" id="' + fieldId + '" style="width:100%;max-width:100%;min-width:0;padding:8px 10px;border:1px solid #ddd;border-radius:6px;font-size:13px;box-sizing:border-box;-webkit-appearance:none;appearance:none" onchange="onFormFieldChange(\'' + prefix + '\',\'' + f.id + '\',this.value)">';
          break;
        case 'image':
        case 'photo':
          html += '<input type="file" id="' + fieldId + '" accept="image/*" capture="environment" style="font-size:12px" onchange="onFormImageChange(\'' + prefix + '\',\'' + f.id + '\',this)">';
          break;
        case 'signature':
          html += '<div style="padding:8px;background:#fff;border:1px dashed #ddd;border-radius:6px;text-align:center;font-size:12px;color:#999">签名功能暂不支持移动端</div>';
          break;
        case 'location':
        case 'area':
        case 'areaTree':
          html += '<input type="text" id="' + fieldId + '" placeholder="请输入位置/区域" style="width:100%;padding:8px 10px;border:1px solid #ddd;border-radius:6px;font-size:13px;box-sizing:border-box" onchange="onFormFieldChange(\'' + prefix + '\',\'' + f.id + '\',this.value)">';
          break;
        default:
          html += '<input type="text" id="' + fieldId + '" placeholder="' + (f.placeholder || '') + '" style="width:100%;padding:8px 10px;border:1px solid #ddd;border-radius:6px;font-size:13px;box-sizing:border-box" onchange="onFormFieldChange(\'' + prefix + '\',\'' + f.id + '\',this.value)">';
      }
      if (f.textDesc) {
        html += '<div style="font-size:11px;color:#999;margin-top:2px">' + f.textDesc + '</div>';
      }
      html += '</div>';
    });
  });
  
  area.innerHTML = html;
}

// 检查表单必填项是否都填写了（返回第一个未填的字段名，全部填完返回null）
function checkRequiredFormFields() {
  if (!_deviceCurrentForm) return null;
  const groups = _deviceCurrentForm.groups || [];
  for (let gi = 0; gi < groups.length; gi++) {
    const g = groups[gi];
    for (const f of (g.fields || [])) {
      if (!f.required) continue;
      const el = document.getElementById('df_' + f.id);
      let val = '';
      if (el) {
        if (el.type === 'checkbox') {
          const arr = _deviceFormData[f.id] || [];
          if (arr.length === 0) return f.label || f.id;
          continue;
        }
        val = el.value;
      } else if (_deviceFormData[f.id] !== undefined) {
        val = _deviceFormData[f.id];
      }
      if (val === null || val === undefined || String(val).trim() === '') {
        return f.label || f.id;
      }
    }
  }
  return null;
}

// 通用表单字段变更（prefix: df_=巡检 / mf_=维修）
function onFormFieldChange(prefix, fieldId, value) {
  if (prefix === 'mf_') { _maintainFormData[fieldId] = value; }
  else { _deviceFormData[fieldId] = value; }
}
// 通用表单复选框变更
function onFormCheckChange(prefix, fieldId, el) {
  const dObj = (prefix === 'mf_') ? _maintainFormData : _deviceFormData;
  let arr = dObj[fieldId] || [];
  if (el.checked) { arr.push(el.value); }
  else { arr = arr.filter(x => x !== el.value); }
  dObj[fieldId] = arr;
}
// 通用表单图片读取
function onFormImageChange(prefix, fieldId, input) {
  const file = input.files[0];

// 收集移动端表单数据
function collectDeviceFormData() {
  if (!_deviceCurrentForm) return null;
  const data = {};
  const groups = _deviceCurrentForm.groups || [];
  groups.forEach(g => {
    (g.fields || []).forEach(f => {
      const el = document.getElementById('df_' + f.id);
      if (el) {
        if (el.type === 'checkbox') {
          // checkbox handled via onchange
        } else {
          data[f.label || f.id] = el.value;
        }
      } else if (_deviceFormData[f.id] !== undefined) {
        data[f.label || f.id] = _deviceFormData[f.id];
      }
    });
  });
  return data;
}

      related_type: 'inspectLog',

    return null;
  }
}

// 加载维修可用表单
async function loadMaintainForms() {
  try {
    const select = document.getElementById('maintain-form-select');
    if (!select) return;
    let forms;
    if (IS_TEST_ENV) {
      forms = await getLocalForms();
    } else {
      let { data, error } = await supabaseClient.from('custom_forms').select('*').eq('deleted', false);
      if (error && String(error.code || '').indexOf('PGRST204') >= 0) {
        const r2 = await supabaseClient.from('custom_forms').select('*');
        data = r2.data; error = r2.error;
      }
      if (error) { console.log('维修表单加载失败:', error.message); return; }
      forms = data || [];
    }
    if (!forms.length) return;
    document.getElementById('maintain-form-group').style.display = 'block';
    forms.sort((a, b) => new Date(b.updatedAt || b.createdAt) - new Date(a.updatedAt || a.createdAt));
    forms.forEach(f => {
      const option = document.createElement('option');
      option.value = f.id;
      option.textContent = f.name || '未命名表单';
      select.appendChild(option);
    });
  } catch (e) {
    console.log('加载维修表单失败:', e);
  }
}

// 检查维修表单必填项
function checkMaintainRequiredFields() {
  if (!_maintainCurrentForm) return null;
  const groups = _maintainCurrentForm.groups || [];
  for (let gi = 0; gi < groups.length; gi++) {
    const g = groups[gi];
    for (const f of (g.fields || [])) {
      if (!f.required) continue;
      const el = document.getElementById('mf_' + f.id);
      let val = '';
      if (el) {
        if (el.type === 'checkbox') {
          const arr = _maintainFormData[f.id] || [];
          if (arr.length === 0) return f.label || f.id;
          continue;
        }
        val = el.value;
      } else if (_maintainFormData[f.id] !== undefined) {
        val = _maintainFormData[f.id];
      }
      if (val === null || val === undefined || String(val).trim() === '') {
        return f.label || f.id;
      }
    }
  }
  return null;
}

// 收集维修表单数据
function collectMaintainFormData() {
  if (!_maintainCurrentForm) return null;
  const data = {};
  const groups = _maintainCurrentForm.groups || [];
  groups.forEach(g => {
    (g.fields || []).forEach(f => {
      const el = document.getElementById('mf_' + f.id);
      if (el) {
        if (el.type === 'checkbox') { /* checkbox handled via onchange */ }
        else { data[f.label || f.id] = el.value; }
      } else if (_maintainFormData[f.id] !== undefined) {
        data[f.label || f.id] = _maintainFormData[f.id];
      }
    });
  });
  return data;
}

// 提交维修记录
async function submitMaintain() {
  if (!currentInspector) {
    alert('请先登录');
    return;
  }
  if (_maintainCurrentForm) {
    const requiredEmpty = checkMaintainRequiredFields();
    if (requiredEmpty) {
      alert('请先填写表单必填项：' + requiredEmpty);
      return;
    }
  }
  const person = currentInspector.name;
  const result = document.getElementById('maintain-result').value;
  const remark = document.getElementById('maintain-remark').value.trim();
  const now = new Date();
  const logDate = now.getFullYear() + "-" + String(now.getMonth() + 1).padStart(2, "0") + "-" + String(now.getDate()).padStart(2, "0");
  const logTime = String(now.getHours()).padStart(2, "0") + ":" + String(now.getMinutes()).padStart(2, "0");
  const deviceId = getQueryParam("id") || '';
  
  const log = {
    id: 'mt_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9),
    deviceId: deviceId,
    logDate: logDate,
    logTime: logTime,
    person: person,
    result: result,
    remark: remark,
    photo: currentMaintainPhoto,
    source: 'qrcode'
  };
  
  // 写本地维保记录（主系统维保记录读取 SL store）
  try {
    await ensureDBReady();
    await dbPut(SL, log);
  } catch (e) { console.error('本地维保记录写入失败:', e); }
  
  // 待同步队列（供主系统导入）
  try {
    const pending = JSON.parse(localStorage.getItem("firemap_maintain_pending") || "[]");
    pending.push(Object.assign({}, log, { synced: false }));
    localStorage.setItem("firemap_maintain_pending", JSON.stringify(pending));
  } catch (e) {}
  
  // 保存维修表单数据
  if (_maintainCurrentForm) {
    const formData = collectMaintainFormData();
    if (formData) {
      try {
        await dbPut(S_FORM_DATA, {
          id: 'formdata_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9),
          form_id: _maintainCurrentForm.id,
          form_name: _maintainCurrentForm.name,
          data: formData,
          related_type: 'maintainLog',
          related_id: log.id,
          created_by: person,
          created_at: new Date().toISOString()
        });
      } catch (e) { console.error('维修表单数据保存失败:', e); }
    }
  }
  
  // 清空已填内容
  document.getElementById('maintain-remark').value = '';
  document.getElementById('maintain-photo').value = '';
  document.getElementById('maintain-photo-preview').style.display = 'none';
  currentMaintainPhoto = null;
  document.getElementById('maintain-form-select').value = '';
  document.getElementById('maintain-form-area').style.display = 'none';
  document.getElementById('maintain-form-area').innerHTML = '';
  _maintainCurrentForm = null;
  _maintainFormData = {};
  
  // 成功提示
  document.getElementById('success-title').innerText = '维修完成';
  document.getElementById('success-msg').innerText = '维修记录已提交：' + result;
  document.getElementById('success-overlay').style.display = 'flex';
}

function getQueryParam(name) {
  return new URL(window.location.href).searchParams.get(name);
}
function decodeData(str) {
  try { return JSON.parse(decodeURIComponent(escape(atob(str)))); } catch(e) { return null; }
}
function getStatusClass(s) {
  if (s === "正常") return "status-normal";
  if (s === "故障") return "status-fault";
  if (s === "待维保") return "status-wait";
  return "";
}

// 巡检记录存储key（主系统可读取）
function getStorageKey() {
  const devId = getQueryParam("id") || "unknown";
  return "firemap_inspect_pending_" + devId;
}

function loadRecords() {
  try {
    // 读取该设备的所有巡检记录
    const allRecords = JSON.parse(localStorage.getItem("firemap_inspect_records") || "{}");
    const devId = getQueryParam("id") || "unknown";
    return allRecords[devId] || [];
  } catch(e) { return []; }
}

function saveRecord(record) {
  try {
    const allRecords = JSON.parse(localStorage.getItem("firemap_inspect_records") || "{}");
    const devId = getQueryParam("id") || "unknown";
    if (!allRecords[devId]) allRecords[devId] = [];
    allRecords[devId].push(record);
    localStorage.setItem("firemap_inspect_records", JSON.stringify(allRecords));
    
    // 同时存入待同步队列，主系统启动时导入
    const pending = JSON.parse(localStorage.getItem("firemap_inspect_pending") || "[]");
    pending.push({...record, deviceId: devId, synced: false});
    localStorage.setItem("firemap_inspect_pending", JSON.stringify(pending));
  } catch(e) {}
}

// 从云端读取该设备的巡检记录
async function loadRecordsFromCloud() {
  try {
    const devId = getQueryParam("id") || "";
    if (!devId) return [];
    // ===== 本地模式（测试环境）：读取本地记录 =====
    if (IS_TEST_ENV) {
      const list = [];
      const local = JSON.parse(localStorage.getItem("firemap_inspect_records") || "{}");
      (local[devId] || []).forEach(r => {
        list.push({ inspector: r.person, result: r.result, remark: r.remark, photo: r.photo, inspect_date: (r.date || '').split(' ')[0], inspect_time: (r.date || '').split(' ')[1] || '' });
      });
      await ensureDBReady();
      const logs = await dbGetAll(S_LOG);
      logs.filter(l => l.deviceId === devId).forEach(l => {
        list.push({ inspector: l.inspector, result: l.result, remark: l.remark, photo: l.photo, inspect_date: l.inspectDate, inspect_time: l.inspectTime });
      });
      return list;
    }
    const { data, error } = await supabaseClient
      .from('inspect_logs')
      .select('*')
      .eq('device_id', devId);
    if (error) {
      console.error('从云端读取巡检记录失败:', error);
      return [];
    }
    return data || [];
  } catch (e) {
    console.error('从云端读取巡检记录异常:', e);
    return [];
  }
}

function renderRecords() {
  const el = document.getElementById("records-list");
  el.innerHTML = '<div class="empty">加载中...</div>';
  loadRecordsFromCloud().then(list => {
    if (!list.length) { el.innerHTML = '<div class="empty">暂无巡检记录</div>'; return; }
    let html = "";
    list.slice().reverse().forEach(r => {
      html += '<div class="record-item">';
      const inspector = r.inspector || r.inspector_name || '未知';
      const result = r.result || r.status || '未知';
      html += '<div class="record-header"><span class="record-person">' + inspector + '</span><span class="record-date">' + (r.inspect_date || '') + ' ' + (r.inspect_time || '') + '</span></div>';
      html += '<div class="record-result">结果：' + result + '</div>';
      if (r.remark) html += '<div class="record-remark">' + r.remark + '</div>';
      if (r.photo) html += '<div class="record-photo"><img src="' + r.photo + '" style="max-width:100%;max-height:150px;border-radius:6px;margin-top:6px;cursor:pointer" onclick="window.open(this.src)"/></div>';
      html += '</div>';
    });
    el.innerHTML = html;
  });
}

async function submitCheck() {
  // 验证登录状态
  if (!currentInspector) {
    alert('请先登录');
    return;
  }
  
  // 必填校验：设备预设了表单时，必须填写表单才能提交
  if (_deviceCurrentForm && _devicePresetFormId) {
    const requiredEmpty = checkRequiredFormFields();
    if (requiredEmpty) {
      alert('请先填写表单必填项：' + requiredEmpty);
      return;
    }
  }
  
  const person = currentInspector.name;
  const inspectorId = currentInspector.id;
  const remark = document.getElementById("check-remark").value.trim();
  
  const now = new Date();
  const date = now.getFullYear() + "-" + String(now.getMonth()+1).padStart(2,"0") + "-" + String(now.getDate()).padStart(2,"0") + " " + String(now.getHours()).padStart(2,"0") + ":" + String(now.getMinutes()).padStart(2,"0");
  
  const record = { 
    person, 
    inspectorId,
    result: currentResult, 
    remark, 
    date,
    photo: currentPhoto,
    timestamp: now.getTime()
  };
  
  saveRecord(record);
  
  // 生成巡检记录ID（用于关联表单）
  const deviceId = getQueryParam("id");
  let inspectLogId = null;
  
  if (IS_TEST_ENV) {
    // ===== 本地模式：写入主系统可见的巡检记录（IndexedDB S_LOG + 表单数据）=====
    if (deviceId) {
      try {
        await ensureDBReady();
        const dev = await getLocalDevice(deviceId);
        const floors = await dbGetAll(SF);
        const buildings = await dbGetAll(SB);
        const floor = floors.find(f => f.id === (dev && dev.floorId));
        const building = buildings.find(b => b.id === (floor && floor.buildingId));
        inspectLogId = 'log_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
        const log = {
          id: inspectLogId,
          deviceId: deviceId,
          taskId: null,
          inspectDate: date.split(" ")[0],
          inspectTime: date.split(" ")[1],
          result: currentResult,
          inspector: person,
          remark: remark,
          photo: currentPhoto,
          source: 'qrcode',
          snapshot_deviceType: (dev && dev.deviceType) || '未知设备',
          snapshot_deviceCode: (dev && dev.deviceCode) || '',
          snapshot_buildingName: (building && building.name) || '',
          snapshot_floorName: (floor && floor.floorName) || ''
        };
        await dbPut(S_LOG, log);
        // 表单数据写本地
        if (_deviceCurrentForm) {
          const formData = collectDeviceFormData();
          if (formData) {
            await dbPut(S_FORM_DATA, {
              id: 'formdata_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9),
              form_id: _deviceCurrentForm.id,
              form_name: _deviceCurrentForm.name,
              data: formData,
              related_type: 'inspectLog',
              related_id: inspectLogId,
              created_by: person,
              created_at: new Date().toISOString()
            });
          }
        }
      } catch (e) {
        console.error('本地巡检记录写入失败:', e);
      }
    }
  } else {
    // ===== 云端模式：同时提交到云端 =====
    if (deviceId) {
      inspectLogId = 'log_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
      await submitInspectToCloud({
        id: inspectLogId,
        deviceId: deviceId,
        inspector: person,
        inspectorId: inspectorId,
        result: currentResult,
        remark: remark,
        photo: currentPhoto,
        inspectDate: date.split(" ")[0],
        inspectTime: date.split(" ")[1]
      });
    }
    
    // 保存自定义表单数据
    if (_deviceCurrentForm && inspectLogId) {
      const formData = collectDeviceFormData();
      if (formData) {
        await saveDeviceFormData(_deviceCurrentForm.id, _deviceCurrentForm.name, formData, inspectLogId);
      }
    }
  }
  
  // 清空已填写的内容（保留预设表单本身，下次巡检可直接再填）
  document.getElementById("check-remark").value = "";
  document.getElementById("check-photo").value = "";
  document.getElementById("photo-preview").style.display = "none";
  currentPhoto = null;
  // 重置表单选择器和已填字段（保留表单显示）
  document.getElementById("check-form-select").value = "";
  // 如果有预设表单，重置其字段值但保留显示；否则隐藏表单区域
  if (_devicePresetFormId) {
    // 重新渲染预设表单，清空已填值
    _deviceCurrentForm = null;
    _deviceFormData = {};
    // 延迟重新加载预设表单
    setTimeout(() => autoLoadPresetForm(), 300);
  } else {
    document.getElementById("check-form-area").style.display = "none";
    document.getElementById("check-form-area").innerHTML = "";
    _deviceCurrentForm = null;
    _deviceFormData = {};
  }
  
  // 等待一下再刷新，确保云端数据已写入
  setTimeout(() => {
    renderRecords();
  }, 500);
  
  // 显示成功弹窗
  document.getElementById('success-title').innerText = '巡检完成';
  document.getElementById("success-msg").innerText = 
    currentResult === "正常" ? "设备正常，巡检完成" : 
    currentResult === "故障" ? "已标记故障，请及时维修" : "已标记需维保，请安排保养";
  document.getElementById("success-overlay").style.display = "flex";
}

function render(d) {
  const type = d.type || d.deviceType || "未知设备";
  const code = d.code || "";
  const status = d.status || "未知";
  const labels = d.labels || {};
  const L = (key, def) => labels[key] || def;
  
  document.getElementById("dev-title").innerText = type;
  document.getElementById("dev-code").innerText = code ? "编号：" + code : "";
  const tag = document.getElementById("dev-status-tag");
  tag.innerText = status;
  tag.className = "status-tag " + getStatusClass(status);
  document.title = type + (code ? " " + code : "") + " - 消防设备巡检";

  // 检查设备是否预设了巡检表单
  _devicePresetFormId = d.inspectFormId || d.inspect_form_id || null;
  if (_devicePresetFormId) {
    // 有预设表单：等 autoLoadPresetForm 成功后由它控制显示
    // 这里先保持隐藏，避免闪现下拉选择器
    // 延迟加载预设表单（等待loadDeviceForms完成）
    setTimeout(() => autoLoadPresetForm(), 500);
  }
  
  const rows = [];
  const pos = d.pos || d.position || d.location;
  if (pos) rows.push([L("pos", "位置"), pos]);
  rows.push(["状态", status]);
  const install = d.install || d.installDate;
  if (install) rows.push([L("install", "安装日期"), install]);
  const life = d.life || d.lifeYears;
  if (life) rows.push([L("life", "使用寿命"), life + " 年"]);
  const next = d.next || d.nextMaintain;
  if (next) rows.push([L("next", "下次维保"), next]);
  const manufacturer = d.manufacturer || d.manufacturerName;
  if (manufacturer) rows.push([L("manufacturer", "生产厂家"), manufacturer]);
  const model = d.model || d.specModel;
  if (model) rows.push([L("model", "规格型号"), model]);
  const person = d.person || d.responsiblePerson;
  if (person) rows.push([L("person", "责任人"), person]);
  const remark = d.remark || d.remarks;
  if (remark) rows.push([L("remark", "备注"), remark]);
  const customData = d.customData || d.customFields;
  if (customData) {
    Object.keys(customData).forEach(k => {
      // 过滤掉系统自动生成的 custom_时间戳 字段（如 custom_1788149028596），避免显示乱码
      if (/^custom_\d+$/.test(k)) return;
      rows.push([k, customData[k]]);
    });
  }
  
  const table = document.getElementById("info-table");
  if (!rows.length) {
    table.innerHTML = '<tr><td colspan="2" style="text-align:center;color:#999;padding:30px">暂无设备信息</td></tr>';
  } else {
    table.innerHTML = rows.map(r => '<tr><td>' + r[0] + '</td><td>' + r[1] + '</td></tr>').join("");
  }
}

  } else {
    // 未登录，显示登录界面
    document.getElementById('login-overlay').style.display = 'flex';
    return;
  }
  
  const deviceId = getQueryParam("id");
  const data = getQueryParam("data");
  
  if (deviceId) {
    // 加载设备信息
    document.getElementById("info-table").innerHTML = '<tr><td colspan="2" style="text-align:center;color:#999;padding:30px">正在加载设备信息...</td></tr>';
    let d;
    if (IS_TEST_ENV) {
      // 本地模式：从主系统本地 IndexedDB 读取设备
      d = await getLocalDevice(deviceId);
      if (!d) d = { _error: '本地未找到该设备（请先在主系统添加该设备）', _code: 'NOT_FOUND' };
    } else {
      // 云端模式：从云端读取设备信息（带自动重试）
      d = await getDeviceFromCloud(deviceId, 3);
    }
    if (d && !d._error) {
      render(d);
    } else {
      const errMsg = d && d._error ? d._error : '未知错误';
      const errCode = d && d._code ? d._code : '';
      const tipHtml = IS_TEST_ENV
        ? '请检查：1.主系统是否已添加该设备 2.扫码手机与主系统是否使用同一浏览器（本地数据按浏览器隔离）'
        : '请检查：1.云端是否已创建 devices 表 2.主系统是否已点击「同步到云端」 3.表权限策略是否正确';
      document.getElementById("info-table").innerHTML = 
        '<tr><td colspan="2" style="text-align:center;color:#d97706;padding:20px;line-height:1.8">' +
        '<div style="font-weight:600;margin-bottom:8px">❌ 设备加载失败</div>' +
        '<div style="font-size:13px;color:#666">设备ID: ' + deviceId + '</div>' +
        '<div style="font-size:13px;color:#666;margin-top:4px">错误码: ' + (errCode || '无') + '</div>' +
        '<div style="font-size:13px;color:#d97706;margin-top:8px;word-break:break-all">' + errMsg + '</div>' +
        '<div style="font-size:12px;color:#999;margin-top:12px">' + tipHtml + '</div>' +
        '<button onclick="retryLoadDevice()" style="margin-top:12px;padding:8px 24px;background:#2563eb;color:#fff;border:none;border-radius:6px;font-size:14px;cursor:pointer">🔄 重新加载</button>' +
        '</td></tr>';
    }
  } else if (data) {
    // 兼容旧版：从URL参数读取
    const d = decodeData(data);
    if (d) render(d);
  } else {
    // URL里没有设备ID参数
    document.getElementById("info-table").innerHTML = 
      '<tr><td colspan="2" style="text-align:center;color:#d97706;padding:20px;line-height:1.8">' +
      '<div style="font-weight:600;margin-bottom:8px">⚠️ 未识别到设备</div>' +
      '<div style="font-size:13px;color:#666">请扫描设备上的专属二维码，或在地址栏添加 ?id=设备ID</div>' +
      '</td></tr>';
  }
  renderRecords();
}

// 重新加载设备（供失败后的重试按钮调用）
function retryLoadDevice() {
  const deviceId = getQueryParam("id");
  if (deviceId) {
    location.reload();
  }
}

// 页面完全就绪后初始化（确保DOM和JS库都加载完成）
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', function() {
    setTimeout(init, 100);
  });
} else {
  setTimeout(init, 100);
}

// 全局错误提示（便于定位问题）
window.addEventListener('error', function(e) {
  var table = document.getElementById('info-table');
  if (table && table.innerHTML.indexOf('正在加载设备信息') >= 0) {
    table.innerHTML = '<tr><td colspan="2" style="text-align:center;color:#d97706;padding:20px;line-height:1.8">' +
      '<div style="font-weight:600;margin-bottom:8px">⚠️ 页面脚本异常</div>' +
      '<div style="font-size:13px;color:#666;word-break:break-all">' + (e.message || '未知错误') + '</div>' +
      '<button onclick="location.reload()" style="margin-top:12px;padding:8px 24px;background:#2563eb;color:#fff;border:none;border-radius:6px;font-size:14px;cursor:pointer">🔄 重新加载</button>' +
      '</td></tr>';
  }
});

// 回车键登录
document.getElementById('login-password').addEventListener('keypress', function(e) {
  if (e.key === 'Enter') doLogin();
});
document.getElementById('login-id').addEventListener('keypress', function(e) {
  if (e.key === 'Enter') document.getElementById('login-password').focus();
});
</script>
</body>
</html>
