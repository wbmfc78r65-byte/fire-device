<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>消防设备信息</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.card {
  background: #fff;
  border-radius: 16px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  max-width: 420px;
  width: 100%;
  overflow: hidden;
}
.card-header {
  background: linear-gradient(135deg, #e74c3c, #c0392b);
  color: #fff;
  padding: 24px;
  text-align: center;
}
.card-header .icon { font-size: 48px; margin-bottom: 8px; }
.card-header h1 { font-size: 22px; font-weight: 600; }
.card-header .code { font-size: 14px; opacity: 0.9; margin-top: 4px; }
.card-body { padding: 20px 24px; }
.info-row {
  display: flex;
  padding: 12px 0;
  border-bottom: 1px solid #f0f0f0;
}
.info-row:last-child { border-bottom: none; }
.info-label {
  width: 80px;
  color: #888;
  font-size: 14px;
  flex-shrink: 0;
}
.info-value {
  flex: 1;
  color: #333;
  font-size: 15px;
  font-weight: 500;
  word-break: break-all;
}
.status-badge {
  display: inline-block;
  padding: 3px 12px;
  border-radius: 12px;
  font-size: 13px;
  font-weight: 600;
}
.status-normal { background: #d4edda; color: #155724; }
.status-fault { background: #f8d7da; color: #721c24; }
.status-wait { background: #fff3cd; color: #856404; }
.status-unknown { background: #e2e3e5; color: #383d41; }
.card-footer {
  padding: 16px 24px;
  background: #f8f9fa;
  text-align: center;
  font-size: 12px;
  color: #999;
}
.empty {
  text-align: center;
  padding: 60px 20px;
  color: #999;
}
.empty h2 { color: #666; margin-bottom: 12px; }
@media print {
  body { background: #fff; padding: 0; }
  .card { box-shadow: none; border: 1px solid #ddd; }
}
</style>
</head>
<body>
<div class="card" id="card">
  <div class="empty" id="empty">
    <h2>暂无设备信息</h2>
    <p>请通过系统生成的二维码访问</p>
  </div>
</div>
<script>
function getQueryParam(name) {
  const url = new URL(window.location.href);
  return url.searchParams.get(name);
}
function decodeData(str) {
  try {
    const json = decodeURIComponent(escape(atob(str)));
    return JSON.parse(json);
  } catch(e) {
    return null;
  }
}
function getStatusClass(status) {
  if (status === "正常") return "status-normal";
  if (status === "故障") return "status-fault";
  if (status === "待维保") return "status-wait";
  return "status-unknown";
}
function render(d) {
  const card = document.getElementById("card");
  const type = d.type || "未知设备";
  const code = d.code || "";
  const status = d.status || "未知";
  let html = '<div class="card-header">';
  html += '<div class="icon">🔥</div>';
  html += '<h1>' + type + '</h1>';
  if (code) html += '<div class="code">编号：' + code + '</div>';
  html += '</div><div class="card-body">';
  if (d.pos) {
    html += '<div class="info-row"><div class="info-label">位置</div><div class="info-value">' + d.pos + '</div></div>';
  }
  html += '<div class="info-row"><div class="info-label">状态</div><div class="info-value"><span class="status-badge ' + getStatusClass(status) + '">' + status + '</span></div></div>';
  if (d.install) {
    html += '<div class="info-row"><div class="info-label">安装日期</div><div class="info-value">' + d.install + '</div></div>';
  }
  if (d.life) {
    html += '<div class="info-row"><div class="info-label">使用寿命</div><div class="info-value">' + d.life + ' 年</div></div>';
  }
  if (d.next) {
    html += '<div class="info-row"><div class="info-label">下次维保</div><div class="info-value">' + d.next + '</div></div>';
  }
  if (d.manufacturer) {
    html += '<div class="info-row"><div class="info-label">生产厂家</div><div class="info-value">' + d.manufacturer + '</div></div>';
  }
  if (d.model) {
    html += '<div class="info-row"><div class="info-label">规格型号</div><div class="info-value">' + d.model + '</div></div>';
  }
  if (d.person) {
    html += '<div class="info-row"><div class="info-label">责任人</div><div class="info-value">' + d.person + '</div></div>';
  }
  if (d.phone) {
    html += '<div class="info-row"><div class="info-label">联系电话</div><div class="info-value">' + d.phone + '</div></div>';
  }
  if (d.remark) {
    html += '<div class="info-row"><div class="info-label">备注</div><div class="info-value">' + d.remark + '</div></div>';
  }
  html += '</div><div class="card-footer">消防设施可视化管理系统</div>';
  card.innerHTML = html;
  document.title = type + (code ? " " + code : "") + " - 消防设备信息";
}
const data = getQueryParam("data");
if (data) {
  const d = decodeData(data);
  if (d) render(d);
}
</script>
</body>
</html>
