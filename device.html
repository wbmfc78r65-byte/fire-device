<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>消防设备信息</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: #f5f5f5;
  min-height: 100vh;
  padding-bottom: 30px;
}
.header {
  background: linear-gradient(135deg, #c0392b, #e74c3c);
  color: #fff;
  padding: 24px 20px;
  text-align: center;
}
.header .icon { font-size: 40px; margin-bottom: 8px; }
.header h1 { font-size: 22px; font-weight: 600; }
.header .code { font-size: 13px; opacity: 0.9; margin-top: 6px; }
.status-tag {
  display: inline-block;
  padding: 3px 14px;
  border-radius: 12px;
  font-size: 13px;
  font-weight: 600;
  margin-top: 10px;
}
.status-normal { background: rgba(255,255,255,0.25); }
.status-fault { background: #721c24; }
.status-wait { background: #856404; }
.container { max-width: 480px; margin: 0 auto; padding: 16px; }
.section {
  background: #fff;
  border-radius: 10px;
  margin-bottom: 16px;
  overflow: hidden;
  box-shadow: 0 2px 8px rgba(0,0,0,0.06);
}
.section-title {
  font-size: 16px;
  font-weight: 600;
  color: #c0392b;
  padding: 14px 16px;
  border-bottom: 2px solid #c0392b;
  display: flex;
  align-items: center;
  gap: 8px;
}
.info-table { width: 100%; border-collapse: collapse; }
.info-table td {
  padding: 12px 16px;
  border-bottom: 1px solid #f0f0f0;
  font-size: 14px;
}
.info-table td:first-child {
  width: 90px;
  color: #888;
  background: #fafafa;
}
.info-table td:last-child {
  color: #333;
  font-weight: 500;
  word-break: break-all;
}
.info-table tr:last-child td { border-bottom: none; }
.form-area { padding: 16px; }
.form-group { margin-bottom: 14px; }
.form-group label {
  display: block;
  font-size: 13px;
  color: #666;
  margin-bottom: 6px;
}
.form-group input, .form-group select, .form-group textarea {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid #ddd;
  border-radius: 6px;
  font-size: 14px;
  font-family: inherit;
}
.form-group textarea { resize: vertical; min-height: 60px; }
.btn-submit {
  width: 100%;
  padding: 12px;
  background: linear-gradient(135deg, #c0392b, #e74c3c);
  color: #fff;
  border: none;
  border-radius: 6px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
}
.records { padding: 0 16px 16px; }
.record-item {
  padding: 12px 0;
  border-bottom: 1px solid #f0f0f0;
  font-size: 13px;
}
.record-item:last-child { border-bottom: none; }
.record-header {
  display: flex;
  justify-content: space-between;
  margin-bottom: 4px;
}
.record-person { font-weight: 600; color: #333; }
.record-date { color: #999; }
.record-result { color: #c0392b; font-weight: 500; }
.record-remark { color: #666; margin-top: 4px; }
.empty { text-align: center; padding: 30px; color: #999; font-size: 14px; }
.tips {
  background: #fff8e1;
  border-left: 3px solid #ffc107;
  padding: 12px 16px;
  font-size: 12px;
  color: #856404;
  margin: 0 16px 16px;
  border-radius: 0 6px 6px 0;
}
@media print {
  body { background: #fff; }
  .section { box-shadow: none; border: 1px solid #ddd; }
}
</style>
</head>
<body>
<div class="header" id="header">
  <div class="icon">🔥</div>
  <h1 id="dev-title">消防设备</h1>
  <div class="code" id="dev-code"></div>
  <span class="status-tag" id="dev-status-tag">未知</span>
</div>

<div class="container">
  <div class="section">
    <div class="section-title">📋 设备信息</div>
    <table class="info-table" id="info-table">
      <tr><td colspan="2" style="text-align:center;color:#999;padding:30px">暂无设备信息</td></tr>
    </table>
  </div>

  <div class="section">
    <div class="section-title">✅ 巡检登记</div>
    <div class="form-area">
      <div class="form-group">
        <label>检查人 *</label>
        <input type="text" id="check-person" placeholder="请输入检查人姓名">
      </div>
      <div class="form-group">
        <label>检查结果 *</label>
        <select id="check-result">
          <option value="正常">正常</option>
          <option value="异常">异常</option>
          <option value="需维修">需维修</option>
          <option value="已维修">已维修</option>
        </select>
      </div>
      <div class="form-group">
        <label>备注</label>
        <textarea id="check-remark" placeholder="检查情况描述（选填）"></textarea>
      </div>
      <button class="btn-submit" onclick="submitCheck()">提交巡检记录</button>
    </div>
  </div>

  <div class="section">
    <div class="section-title">📝 历史记录</div>
    <div class="records" id="records-list">
      <div class="empty">暂无巡检记录</div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">📖 使用说明</div>
    <div class="form-area" id="usage-guide" style="font-size:14px;line-height:1.8;color:#555">
      <p>请根据设备类型查阅相关使用说明。</p>
    </div>
  </div>

  <div style="text-align:center;margin-bottom:16px">
    <button class="btn-submit" style="width:auto;padding:10px 24px;display:inline-block" onclick="exportRecords()">📥 导出巡检记录(CSV)</button>
  </div>

  <div class="tips">💡 巡检记录保存在本设备浏览器中，更换手机或清除缓存后将无法查看。导出CSV可备份记录。</div>
</div>

<script>
function getQueryParam(name) {
  return new URL(window.location.href).searchParams.get(name);
}
function decodeData(str) {
  try { return JSON.parse(decodeURIComponent(escape(atob(str)))); } catch(e) { return null; }
}
function getStatusClass(s) {
  if (s === "正常") return "status-normal";
  if (s === "故障") return "status-fault";
  if (s === "待维保") return "status-wait";
  return "";
}
function getStorageKey() {
  const data = getQueryParam("data");
  return "fire_check_" + (data ? data.substring(0, 20) : "unknown");
}
function loadRecords() {
  try {
    const key = getStorageKey();
    return JSON.parse(localStorage.getItem(key) || "[]");
  } catch(e) { return []; }
}
function saveRecords(list) {
  try { localStorage.setItem(getStorageKey(), JSON.stringify(list)); } catch(e) {}
}
function renderRecords() {
  const list = loadRecords();
  const el = document.getElementById("records-list");
  if (!list.length) { el.innerHTML = '<div class="empty">暂无巡检记录</div>'; return; }
  let html = "";
  list.slice().reverse().forEach(r => {
    html += '<div class="record-item">';
    html += '<div class="record-header"><span class="record-person">' + r.person + '</span><span class="record-date">' + r.date + '</span></div>';
    html += '<div class="record-result">结果：' + r.result + '</div>';
    if (r.remark) html += '<div class="record-remark">' + r.remark + '</div>';
    html += '</div>';
  });
  el.innerHTML = html;
}
function submitCheck() {
  const person = document.getElementById("check-person").value.trim();
  const result = document.getElementById("check-result").value;
  const remark = document.getElementById("check-remark").value.trim();
  if (!person) { alert("请输入检查人姓名"); return; }
  const now = new Date();
  const date = now.getFullYear() + "-" + String(now.getMonth()+1).padStart(2,"0") + "-" + String(now.getDate()).padStart(2,"0") + " " + String(now.getHours()).padStart(2,"0") + ":" + String(now.getMinutes()).padStart(2,"0");
  const list = loadRecords();
  list.push({ person, result, remark, date });
  saveRecords(list);
  document.getElementById("check-person").value = "";
  document.getElementById("check-remark").value = "";
  renderRecords();
  alert("巡检记录已提交！");
}
function exportRecords() {
  const list = loadRecords();
  if (!list.length) { alert("暂无巡检记录可导出"); return; }
  let csv = "\uFEFF检查人,检查结果,检查时间,备注\n";
  list.forEach(r => {
    csv += '"' + r.person + '","' + r.result + '","' + r.date + '","' + (r.remark || "") + '"\n';
  });
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "巡检记录_" + new Date().toISOString().split("T")[0] + ".csv";
  a.click();
  URL.revokeObjectURL(url);
}
function renderUsageGuide(type) {
  const el = document.getElementById("usage-guide");
  const guides = {
    "室内消火栓": "1. 打开消火栓门<br>2. 取出水带，一端接消火栓口，一端接水枪<br>3. 逆时针打开阀门<br>4. 握紧水枪，对准火焰根部喷射",
    "灭火器": "1. 提起灭火器<br>2. 拔掉保险销<br>3. 握住喷管，对准火焰根部<br>4. 压下压把，左右扫射",
    "烟感探测器": "定期检查指示灯是否正常闪烁<br>每年进行一次功能测试<br>发现故障及时更换",
    "喷淋头": "定期检查喷淋头是否有损坏、堵塞<br>每年进行一次末端试水<br>发现漏水及时维修",
    "防火门": "保持防火门常闭状态<br>检查闭门器是否正常工作<br>禁止堆放物品阻挡防火门"
  };
  let content = guides[type] || "请查阅设备说明书或联系物业管理人员了解使用方法。<br><br>消防设备应定期检查，确保完好有效。";
  el.innerHTML = "<p>" + content + "</p>";
}
function render(d) {
  const type = d.type || "未知设备";
  const code = d.code || "";
  const status = d.status || "未知";
  const labels = d.labels || {};
  const L = (key, def) => labels[key] || def;
  document.getElementById("dev-title").innerText = type;
  document.getElementById("dev-code").innerText = code ? "编号：" + code : "";
  const tag = document.getElementById("dev-status-tag");
  tag.innerText = status;
  tag.className = "status-tag " + getStatusClass(status);
  document.title = type + (code ? " " + code : "") + " - 消防设备信息";
  const rows = [];
  if (d.pos) rows.push([L("pos", "位置"), d.pos]);
  rows.push(["状态", status]);
  if (d.install) rows.push([L("install", "安装日期"), d.install]);
  if (d.life) rows.push([L("life", "使用寿命"), d.life + " 年"]);
  if (d.next) rows.push([L("next", "下次维保"), d.next]);
  if (d.manufacturer) rows.push([L("manufacturer", "生产厂家"), d.manufacturer]);
  if (d.model) rows.push([L("model", "规格型号"), d.model]);
  if (d.person) rows.push([L("person", "责任人"), d.person]);
  if (d.phone) rows.push([L("phone", "联系电话"), d.phone]);
  if (d.remark) rows.push([L("remark", "备注"), d.remark]);
  if (d.customData) {
    Object.keys(d.customData).forEach(k => {
      rows.push([k, d.customData[k]]);
    });
  }
  const table = document.getElementById("info-table");
  if (!rows.length) {
    table.innerHTML = '<tr><td colspan="2" style="text-align:center;color:#999;padding:30px">暂无设备信息</td></tr>';
  } else {
    table.innerHTML = rows.map(r => '<tr><td>' + r[0] + '</td><td>' + r[1] + '</td></tr>').join("");
  }
  renderUsageGuide(type);
}
const data = getQueryParam("data");
if (data) {
  const d = decodeData(data);
  if (d) render(d);
}
renderRecords();
</script>
</body>
</html>
